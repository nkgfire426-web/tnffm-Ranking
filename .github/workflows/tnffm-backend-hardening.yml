name: TNFFM Backend Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Google Apps Script backend
        shell: python
        run: |
          from pathlib import Path

          path = Path("create-a-professional-esports-community-leaderboard/google-apps-script/Code.gs")
          text = path.read_text(encoding="utf-8")

          required = [
              "function doGet()",
              "function doPost(e)",
              "function publicData_()",
              "function read_(name)",
              "function write_(name,items)",
              "T.TEAMS",
              "T.ROSTERS",
              "T.RANKINGS",
              "T.EVENTS",
              "T.RESULTS",
              "T.NEWS",
              "T.COLLAB",
              "T.ACCOUNTS",
              "T.SUBMISSIONS",
              "T.FEEDBACK",
              "LockService.getScriptLock()",
              "CacheService.getScriptCache()",
          ]

          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit("Missing backend markers: " + repr(missing))

          if "function deleteRegisteredTeam_" in text and 'case "deleteteam"' not in text:
              raise SystemExit("deleteRegisteredTeam_ exists without a doPost action mapping")

          print("TNFFM Google Apps Script backend validation passed")

      - name: Validate Next.js API surface
        shell: python
        run: |
          from pathlib import Path

          root = Path("create-a-professional-esports-community-leaderboard/src/app/api")
          required = [
              "teams/route.ts",
              "admin/login/route.ts",
              "admin/save/route.ts",
              "admin/delete-team/route.ts",
              "team/auth/login/route.ts",
              "team/auth/logout/route.ts",
              "team/me/route.ts",
              "team/logo/route.ts",
              "collaborators/route.ts",
              "tracked-events/route.ts",
          ]

          missing = [str(root / path) for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit("Missing API routes: " + repr(missing))

          print("TNFFM Next.js API surface validation passed")
