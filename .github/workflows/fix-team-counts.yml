name: Fix team ranking counts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-counts:
    if: ${{ !contains(github.event.head_commit.message, '[counts-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update admin team count logic
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('create-a-professional-esports-community-leaderboard/src/components/AdminDashboard.tsx')
          text = path.read_text()

          # Import the canonical event-count calculator.
          if 'getEventsPlayed } from "@/lib/rankings"' not in text:
              text = text.replace('import { calculateCommunityPoints } from "@/lib/rankings";', 'import { calculateCommunityPoints, getEventsPlayed } from "@/lib/rankings";')

          # Never allow a manually entered Events Played value to become the source of truth.
          old_field = '<Field label="Events Played" value={team.eventsPlayed} onChange={(v) => update(index, "eventsPlayed", v)} type="number" />'
          new_field = '<div><Field label="Official Match Count" value={team.officialMatchFinalists || 0} onChange={(v) => update(index, "officialMatchFinalists", v)} type="number" /><p className="mt-1 text-[11px] text-slate-500">Official match finalist count</p></div><div><div className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Events Played (Auto)</div><div className="w-full rounded-lg border border-gold/20 bg-gold/5 px-3 py-2.5 font-bold text-gold">{getEventsPlayed(team)}</div><p className="mt-1 text-[11px] text-slate-500">Auto-counted from recorded finishes and official matches</p></div>'
          text = text.replace(old_field, new_field)

          # Replace the Events Played value with the calculated value whenever saving.
          old_normalize = 'const normalizedTeams = teams.map((team) => { const copy: any = { ...team }; numericKeys.forEach((key) => { if (key in copy) copy[key] = typeof copy[key] === "number" ? copy[key] : Number(String(copy[key] || "").trim()) || 0; }); return copy; });'
          new_normalize = 'const normalizedTeams = teams.map((team) => { const copy: any = { ...team }; numericKeys.forEach((key) => { if (key in copy) copy[key] = typeof copy[key] === "number" ? copy[key] : Number(String(copy[key] || "").trim()) || 0; }); copy.eventsPlayed = getEventsPlayed(copy); copy.officialMatchFinalists = Math.max(0, Number(copy.officialMatchFinalists) || 0); return copy; });'
          if old_normalize in text:
              text = text.replace(old_normalize, new_normalize)

          path.write_text(text)

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add create-a-professional-esports-community-leaderboard/src/components/AdminDashboard.tsx
          git commit -m 'Fix automatic event and official match counts [counts-fix]'
          git push
