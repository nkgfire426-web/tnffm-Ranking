name: Fix team poster download

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: make team poster download reliable') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch poster download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("create-a-professional-esports-community-leaderboard/src/app/team-dashboard/page.tsx")
          s = p.read_text()
          s = s.replace('import { toPng } from "html-to-image";\n', '')
          new = "  async function downloadPoster() {\n    if (!team || !posterRef.current || generatingPoster) return;\n    setGeneratingPoster(true); setMessage(\"\");\n    try {\n      const { toBlob } = await import(\"html-to-image\");\n      const blob = await toBlob(posterRef.current, { width: 1080, height: 1350, pixelRatio: 1, cacheBust: true, backgroundColor: \"#050507\", skipFonts: true });\n      if (!blob) throw new Error(\"PNG creation returned no data\");\n      const url = URL.createObjectURL(blob);\n      const link = document.createElement(\"a\");\n      link.href = url;\n      link.download = `${team.teamName.replace(/[^a-z0-9]+/gi, \"-\").replace(/^-|-$/g, \"\") || \"team\"}-TNFFM-Community-Rankings.png`;\n      link.style.position = \"fixed\"; link.style.left = \"-9999px\";\n      document.body.appendChild(link); link.click(); link.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 5000);\n      setMessage(\"Official TNFFM team poster downloaded successfully.\");\n    } catch (error) {\n      console.error(\"Poster generation failed\", error);\n      setMessage(\"Poster download failed. Please try again.\");\n    } finally { setGeneratingPoster(false); }\n  }\n"
          pattern = r'  async function downloadPoster\(\) \{.*?\n  \}\n  async function logout'
          s2, n = re.subn(pattern, new + '  async function logout', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('downloadPoster function not found')
          p.write_text(s2)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add create-a-professional-esports-community-leaderboard/src/app/team-dashboard/page.tsx
          git commit -m "fix: make team poster download reliable" || exit 0
          git push
