name: Repair tracked event typing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[typing-repair-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace controlled admin fields with local draft fields
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('create-a-professional-esports-community-leaderboard/src/components/AdminDashboard.tsx')
          text = path.read_text()

          pattern = re.compile(r'const Field = memo\(function Field\(.*?\n\}\);', re.S)
          replacement = '''const Field = memo(function Field({ label, value, onChange, type = "text" }: { label: string; value: string | number | null | undefined; onChange: (value: string) => void; type?: string }) {
  const [localValue, setLocalValue] = useState(String(value ?? ""));
  const inputRef = useRef<HTMLInputElement>(null);

  useEffect(() => {
    if (document.activeElement !== inputRef.current) {
      setLocalValue(String(value ?? ""));
    }
  }, [value]);

  const commit = () => {
    const nextValue = inputRef.current?.value ?? localValue;
    if (nextValue !== String(value ?? "")) onChange(nextValue);
  };

  return <label className="block"><span className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">{label}</span><input ref={inputRef} type={type} value={localValue} onChange={(e) => setLocalValue(e.target.value)} onBlur={commit} className="w-full rounded-lg border border-white/10 bg-black/45 px-3 py-2.5 text-white outline-none transition focus:border-gold/60" /></label>;
});'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate the Field component')
          if updated != text:
              path.write_text(updated)

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add create-a-professional-esports-community-leaderboard/src/components/AdminDashboard.tsx
          git commit -m 'Fix admin field continuous typing [typing-repair-v2]'
          git push
