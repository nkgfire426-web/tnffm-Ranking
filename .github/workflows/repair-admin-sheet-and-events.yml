name: Repair Admin Events and Sheet Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-admin-sheet-and-events.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Admin Dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('create-a-professional-esports-community-leaderboard/src/components/AdminDashboard.tsx')
          s = p.read_text()

          old = 'const [teams, setTeams] = useState<RawTeam[]>(initialTeams);'
          new = 'const [teams, setTeams] = useState<RawTeam[]>(() => initialTeams.map((team) => ({ ...team, eventsPlayed: getEventsPlayed(team) })));'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'if (Array.isArray(result.teams)) setTeams(result.teams);'
          new = 'if (Array.isArray(result.teams)) setTeams(result.teams.map((team) => ({ ...team, eventsPlayed: getEventsPlayed(team) })));'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'copy.eventsPlayed = getEventsPlayed(copy); copy.officialMatchFinalists = Math.max(0, Number(copy.officialMatchFinalists) || 0);'
          new = 'const manualEventsPlayed = Number(copy.eventsPlayed); copy.eventsPlayed = Number.isFinite(manualEventsPlayed) && manualEventsPlayed >= 0 ? manualEventsPlayed : getEventsPlayed(copy); copy.officialMatchFinalists = Math.max(0, Number(copy.officialMatchFinalists) || 0);'
          if old not in s:
              raise SystemExit('Could not find save calculation block')
          s = s.replace(old, new, 1)

          old = '<div><div className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-400">Events Played (Auto)</div><div className="w-full rounded-lg border border-gold/20 bg-gold/5 px-3 py-2.5 font-bold text-gold">{getEventsPlayed(team)}</div><p className="mt-1 text-[11px] text-slate-500">Auto-counted from recorded finishes and official matches</p></div>'
          new = '<div><Field label="Events Played (Auto / Editable)" value={team.eventsPlayed ?? getEventsPlayed(team)} onChange={(v) => update(index, "eventsPlayed", v)} type="number" /><p className="mt-1 text-[11px] text-slate-500">Starts with the automatic count. You can manually override it before saving.</p></div>'
          if old not in s:
              raise SystemExit('Could not find Events Played UI block')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Repair Google Sheets save calculation
        shell: python
        run: |
          from pathlib import Path
          p = Path('create-a-professional-esports-community-leaderboard/src/app/api/admin/save/route.ts')
          s = p.read_text()
          old = 'team.eventsPlayed = eventsPlayed(team);'
          new = 'const suppliedEventsPlayed = num(team.eventsPlayed); team.eventsPlayed = suppliedEventsPlayed > 0 ? suppliedEventsPlayed : eventsPlayed(team);'
          if old not in s:
              raise SystemExit('Could not find EventsPlayed save calculation')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Verify required fixes exist
        run: |
          grep -q 'Events Played (Auto / Editable)' create-a-professional-esports-community-leaderboard/src/components/AdminDashboard.tsx
          grep -q 'suppliedEventsPlayed' create-a-professional-esports-community-leaderboard/src/app/api/admin/save/route.ts

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add create-a-professional-esports-community-leaderboard/src/components/AdminDashboard.tsx create-a-professional-esports-community-leaderboard/src/app/api/admin/save/route.ts
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'Fix editable Events Played and Google Sheets save [skip ci]'
          git push
